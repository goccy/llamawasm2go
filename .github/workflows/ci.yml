name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify llama-wasm attestations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # make verify checks every in-tree file against the release sha256
      # manifest AND its upstream SLSA build-provenance attestation (fetched
      # anonymously from the public attestation API — no token needed; the
      # Makefile unsets GH_TOKEN/GITHUB_TOKEN). gh, jq, curl and shasum are
      # preinstalled on ubuntu-latest.
      - name: Verify wasm2go bundle (release diff + attestation)
        run: make verify
      # The manifest and the tracked tree must be the same file set: tar
      # extraction never deletes, and shasum -c only checks listed files,
      # so a file the previous bundle shipped could otherwise survive a
      # rebundle unnoticed.
      - name: Verify the tree matches the manifest
        run: make verify-tree

  build:
    name: Go build + consumer link per asm target
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make build
      # `go build ./...` never runs the linker; a bundle that compiles
      # everywhere can still fail to link (ABI-wrapper cycles across
      # chunk packages — v0.3.1 did). Link a consumer that reaches every
      # export for linux/arm64, linux/amd64 v2 and v1.
      - name: Link a consumer against the bundle for every asm target
        run: make link-check
